<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Movie Tracker</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>My Movie Tracker</h1>
            <div class="header-actions">
                <button id="settings-btn">Settings</button>
                <button id="open-search-btn">Search</button>
            </div>
        </header>

        <div id="message-box"></div>

        <div id="search-overlay" class="search-overlay-hidden">
            <button id="close-search-btn" class="close-btn">&times;</button>
            <div class="search-modal-content">
                <div class="search-section">
                    <input type="text" id="search-input" placeholder="Search for a movie title...">
                    <button id="search-btn">Clear</button>
                </div>
                <ul id="search-results">
                    <!-- Search results will be injected here -->
                </ul>
            </div>
        </div>

        <!-- Sorting and Filtering Section -->
        <div class="controls-section">
            <div class="sort-controls">
                <label for="sort-select">Sort By:</label>
                <select id="sort-select">
                    <option value="date-desc">Watch Date (Newest First)</option>
                    <option value="date-asc">Watch Date (Oldest First)</option>
                    <option value="rating-desc">Rating (Highest First)</option>
                    <option value="rating-asc">Rating (Lowest First)</option>
                    <option value="title-asc">Title (A-Z)</option>
                    <option value="title-desc">Title (Z-A)</option>
                </select>
            </div>
            <div class="filter-controls">
                <button id="filter-toggle-btn" type="button">Filter</button>
                <button id="reset-filters-btn" type="button">Reset</button>
            </div>
        </div>

        <div id="filter-panel">
            <div class="filter-group">
                <label for="filter-genre-select">Genre:</label>
                <select id="filter-genre-select">
                    <option value="all">All Genres</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filter-director-select">Director:</label>
                <select id="filter-director-select">
                    <option value="all">All Directors</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filter-year-select">Release Year:</label>
                <select id="filter-year-select">
                    <option value="all">All Years</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filter-format-select">Format:</label>
                <select id="filter-format-select">
                    <option value="all">All Formats</option>
                </select>
            </div>
        </div>

        <ul id="movie-list">
            <!-- Movies will be injected here -->
        </ul>
    </div>

    <!-- Movie Details Modal (for adding and editing a movie) -->
    <div id="movie-details-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn add-close-btn">&times;</span>
            <h2 id="modal-movie-title"></h2>
            <form id="details-form">
                <div id="modal-message-box"></div>
                <div class="form-group">
                    <label>Your Rating:</label>
                    <div class="custom-select-container">
                        <div class="custom-select-trigger" id="rating-trigger">
                            <span id="rating-text">Select a rating...</span>
                            <span class="arrow">▼</span>
                        </div>
                        <div class="custom-options" id="rating-options">
                            <!-- Options will be populated by JS -->
                        </div>
                    </div>
                    <input type="hidden" id="rating-value" value="0">
                </div>
                <div class="form-group">
                    <label for="watch-date-input">Date Watched:</label>
                    <div class="date-group">
                        <input type="date" id="watch-date-input">
                        <button type="button" id="today-btn">Today</button>
                    </div>
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="rewatch-checkbox">
                    <label for="rewatch-checkbox">This is a rewatch</label>
                </div>
                <div class="form-group">
                    <label for="format-input">Watched on:</label>
                    <input type="text" list="formats" id="format-input" placeholder="e.g., Netflix, Cinema">
                    <datalist id="formats">
                        <option value="Netflix"></option>
                        <option value="Prime"></option>
                        <option value="Disney+"></option>
                        <option value="HBO"></option>
                        <option value="Cinema"></option>
                        <option value="Online"></option>
                        <option value="NPO Start"></option>
                        <option value="TV"></option>
                    </datalist>
                </div>
                <div class="form-group">
                    <label for="comment-input">Comments:</label>
                    <textarea id="comment-input" rows="3"></textarea>
                </div>

                <div class="form-group">
                    <label for="custom-poster-input">Poster URL:</label>
                    <input type="text" id="custom-poster-input" placeholder="Optional poster URL">
                    <button type="button" id="show-poster-btn">Fetch Poster</button>
                </div>

                <div class="modal-buttons">
                    <button type="button" id="cancel-btn">Cancel</button>
                    <button type="submit" id="save-btn">Add to List</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Movie Info Modal (for viewing a watched movie) -->
    <div id="movie-info-modal" class="modal">
        <div class="modal-content">
            <div class="info-header">
                <h2 id="info-modal-title"></h2>
                <span class="close-btn info-close-btn">&times;</span>
            </div>
            <div class="info-grid">
                <div class="info-item">
                    <strong>Director</strong>
                    <p id="info-director"></p>
                </div>
                <div class="info-item">
                    <strong>Genres</strong>
                    <p id="info-genres"></p>
                </div>
                <div class="info-item">
                    <strong>Runtime</strong>
                    <p id="info-runtime"></p>
                </div>
                <div class="info-item">
                    <strong>Watched</strong>
                    <p id="info-date"></p>
                </div>
                <div class="info-item" id="info-format-p">
                    <strong>Format</strong>
                    <p id="info-format"></p>
                </div>
                <div class="info-item">
                    <strong>Rewatch</strong>
                    <p id="info-rewatch"></p>
                </div>
            </div>
            <div class="info-item" id="info-comment-p">
                <strong>Comments</strong>
                <p id="info-comment"></p>
            </div>
            <div class="info-buttons">
                <button type="button" id="edit-btn">Edit</button>
                <button type="button" id="delete-btn">Delete</button>
                <button type="button" id="imdb-btn">IMDb</button>
                <button type="button" id="letterboxd-btn">Letterboxd</button>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="delete-confirm-modal" class="modal">
        <div class="modal-content">
            <h2>Are you sure?</h2>
            <p>This will permanently remove the movie from your list.</p>
            <div class="modal-buttons">
                <button type="button" id="cancel-delete-btn">Cancel</button>
                <button type="button" id="confirm-delete-btn">Yes, delete</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn settings-close-btn">&times;</span>
            <h2>Settings</h2>
            <div class="settings-options">
                <div class="setting-item">
                    <label>Data Storage:</label>
                    <button id="select-save-location-btn">Select Save Location</button>
                    <p class="setting-description">Choose where to save your movie data file.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Poster Selection Modal -->
    <div id="poster-modal" class="modal">
        <div class="modal-content poster-modal-content">
            <span class="close-btn poster-close-btn">&times;</span>
            <h2>Select Poster</h2>
            <div id="poster-grid" class="poster-grid"></div>
        </div>
    </div>

    <script type="module" src="../../app.js"></script>
</body>

</html>
