name: Build and Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Type of version bump'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Configure Git
        shell: bash
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Bump Version and Tag
        working-directory: Electron-movie
        shell: bash
        run: |
          BUMP_TYPE="${{ github.event.inputs.bump_type }}"
          
          # Find the latest tag, default to v1.0.0 if none exist
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          
          # Remove 'v' prefix
          VERSION_NUM=${LATEST_TAG#v}
          
          # Split into parts
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NUM"
          
          if [ "$BUMP_TYPE" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$BUMP_TYPE" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi
          
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          
          echo "Bumping version from $VERSION_NUM to $NEW_VERSION"
          
          # Update package.json locally (so electron-builder uses it) but don't commit it
          npm version $NEW_VERSION --no-git-tag-version
          
          # Tag the current commit and push the tag
          git tag "v$NEW_VERSION"
          git push origin "v$NEW_VERSION"

      - name: Install Dependencies
        working-directory: Electron-movie
        run: npm ci

      - name: Build and Publish Release
        working-directory: Electron-movie
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build -- -p always
